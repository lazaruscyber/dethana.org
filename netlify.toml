[build]
  command = "cd site && npm ci && npm run build && test -f dist/data/menu.json && test -f dist/data/books/Dhp.json.gz"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "site/public/data/menu.json",
    "site/public/data/langs.json",
    "site/public/data/headings.json.gz"
  ]

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
