[build]
  command = "cd site && npm ci && npm run build"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "site/public/data/menu.json",
    "site/public/data/langs.json",
    "site/public/data/headings.json.gz"
  ]

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/api/menu"
  to = "/.netlify/functions/menu"
  status = 200

[[redirects]]
  from = "/api/langs"
  to = "/.netlify/functions/langs"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/book"
  to = "/.netlify/functions/book"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
