services:
  - type: web
    name: dethana
    runtime: static
    buildCommand: cd site && npm ci && npm run build
    staticPublishPath: site/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
